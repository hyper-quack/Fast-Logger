# Push a tag `vX.Y.Z` (matching Cargo.toml and bindings/bun/package.json) to:
#   - build the CLI + shared library for macOS (arm64, x64) and Linux (x64, arm64; glibc 2.17+)
#   - publish rotlog-<platform> packages and rotlog to npm   (secret NPM_TOKEN)
#   - publish the crate to crates.io                          (secret CARGO_REGISTRY_TOKEN)
#   - attach the binaries to a GitHub Release
# Re-running is safe: versions already published are skipped.
# "Run workflow" (workflow_dispatch) only builds, to check the matrix without publishing.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release
      - uses: oven-sh/setup-bun@v2
      - working-directory: bindings/bun
        run: bun install && bun test

  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          # Symbols are stripped by the linker (-x / -s), not by Cargo's `strip` (see Cargo.toml).
          - { os: macos-14, target: aarch64-apple-darwin, npm: darwin-arm64, lib: librotlog.dylib, strip: "-C link-arg=-Wl,-x" }
          - { os: macos-14, target: x86_64-apple-darwin, npm: darwin-x64, lib: librotlog.dylib, strip: "-C link-arg=-Wl,-x" }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, glibc: "2.17", npm: linux-x64-gnu, lib: librotlog.so, strip: "-C link-arg=-s" }
          - { os: ubuntu-22.04, target: aarch64-unknown-linux-gnu, glibc: "2.17", npm: linux-arm64-gnu, lib: librotlog.so, strip: "-C link-arg=-s" }
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.strip }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cargo-zigbuild
        if: matrix.glibc
        run: |
          python3 -m pip install --user cargo-zigbuild ziglang
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build
        run: |
          if [ -n "${{ matrix.glibc }}" ]; then
            cargo zigbuild --release --locked --target ${{ matrix.target }}.${{ matrix.glibc }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
      - name: Stage
        run: |
          mkdir -p "artifacts/${{ matrix.npm }}"
          cp "target/${{ matrix.target }}/release/rotlog" "target/${{ matrix.target }}/release/${{ matrix.lib }}" "artifacts/${{ matrix.npm }}/"
          file "artifacts/${{ matrix.npm }}"/*
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.npm }}
          path: artifacts
          if-no-files-found: error

  publish:
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: artifacts
          merge-multiple: true

      - name: Check the tag matches the versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          npm_version=$(jq -r .version bindings/bun/package.json)
          echo "tag=$tag cargo=$cargo_version npm=$npm_version"
          test "$tag" = "$cargo_version" && test "$tag" = "$npm_version"

      - name: Assemble npm packages
        run: bun bindings/bun/scripts/pack-npm.ts --artifacts artifacts --out dist/npm

      # Errors are also emitted as ::error annotations: those are readable on the
      # run page and through the public API, unlike raw logs.
      - name: Check registry credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          ok=1
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error title=NPM_TOKEN is not set::Add it under Settings > Secrets and variables > Actions > Repository secrets (exact name NPM_TOKEN)."
            ok=0
          elif ! who=$(npm whoami 2>&1); then
            echo "::error title=npm rejected NPM_TOKEN::$(echo "$who" | grep -E 'npm (error|ERR)' | head -4 | tr '\n' ' ')"
            ok=0
          else
            echo "npm: authenticated as $who"
          fi
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error title=CARGO_REGISTRY_TOKEN is not set::Add it under Settings > Secrets and variables > Actions > Repository secrets (exact name CARGO_REGISTRY_TOKEN)."
            ok=0
          fi
          [ "$ok" = 1 ]

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Platform packages first: the main package depends on them.
          for dir in dist/npm/rotlog-* dist/npm/rotlog; do
            name=$(jq -r .name "$dir/package.json")
            version=$(jq -r .version "$dir/package.json")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
              continue
            fi
            if ! out=$(npm publish "$dir" --access public 2>&1); then
              echo "$out"
              echo "::error title=npm publish $name failed::$(echo "$out" | grep -E 'npm (error|ERR)' | head -6 | tr '\n' ' ')"
              exit 1
            fi
            echo "$out"
          done

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if curl -fsS -A "rotlog-release (github actions)" "https://crates.io/api/v1/crates/rotlog/$version" >/dev/null 2>&1; then
            echo "rotlog $version is already on crates.io"
            exit 0
          fi
          if ! out=$(cargo publish --locked 2>&1); then
            echo "$out"
            echo "::error title=cargo publish failed::$(echo "$out" | grep -E '^(error|Caused by)' -A2 | head -6 | tr '\n' ' ')"
            exit 1
          fi
          echo "$out"

      - name: Package binaries
        run: |
          mkdir -p dist/release
          for dir in artifacts/*/; do
            key=$(basename "$dir")
            chmod +x "$dir/rotlog"
            tar -czf "dist/release/rotlog-${GITHUB_REF_NAME}-${key}.tar.gz" -C "$dir" .
          done
          (cd dist/release && sha256sum *.tar.gz > SHA256SUMS)

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/*.tar.gz
            dist/release/SHA256SUMS
          generate_release_notes: true
